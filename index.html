<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Исследователи Магнит</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfaf6;
    --bg-soft:#f4ece2;
    --card:#fdfaf6;
    --ink:#221c17;
    --ink-soft:#7a6b5c;
    --line:#e4d5c3;
    --accent:#e1052b;
    --accent-ink:#ffffff;
    --accent-soft:#fbe2df;
    --bad:#a8431a;
    --bad-soft:#f6e4d4;
    --good:#276b45;
    --good-soft:#e2ecdd;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1512;
      --bg-soft:#231c17;
      --card:#1a1512;
      --ink:#f3ece2;
      --ink-soft:#b3a08c;
      --line:#332924;
      --accent:#ff5266;
      --accent-ink:#1a1512;
      --accent-soft:#3a1e1d;
      --bad:#f0a374;
      --bad-soft:#3a2618;
      --good:#8fcf9e;
      --good-soft:#1c2c1d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1512;
    --bg-soft:#231c17;
    --card:#1a1512;
    --ink:#f3ece2;
    --ink-soft:#b3a08c;
    --line:#332924;
    --accent:#ff5266;
    --accent-ink:#1a1512;
    --accent-soft:#3a1e1d;
    --bad:#f0a374;
    --bad-soft:#3a2618;
    --good:#8fcf9e;
    --good-soft:#1c2c1d;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Golos Text', 'Segoe UI', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{font-family:'Unbounded','Golos Text',sans-serif; margin:0; text-wrap:balance;}

  #deck{position:fixed; inset:0; overflow:hidden;}
  #track{display:flex; height:100%; width:100%; transition:transform .55s cubic-bezier(.65,0,.35,1);}
  .slide{
    flex:0 0 100%;
    width:100%;
    height:100%;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: clamp(20px,6vw,72px) clamp(20px,7vw,120px);
  }
  .slide::-webkit-scrollbar{width:0;height:0;}

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin-bottom:14px;
  }
  .eyebrow::before{content:""; width:16px; height:2px; background:var(--accent); display:inline-block;}

  .slide h2{font-size:clamp(1.5rem,1rem + 2.1vw,2.5rem); font-weight:700; line-height:1.12; letter-spacing:-.01em; max-width:16ch;}

  .bullets{list-style:none; margin:clamp(20px,3vw,34px) 0 0; padding:0; display:flex; flex-direction:column; gap:clamp(12px,1.8vw,18px); max-width:62ch;}
  .bullets li{
    position:relative; padding-left:28px; font-size:clamp(1rem,.85rem + .5vw,1.2rem); line-height:1.5; color:var(--ink);
  }
  .bullets li::before{
    content:""; position:absolute; left:0; top:.55em; width:9px; height:9px; border-radius:2px; background:var(--accent);
  }
  .bullets b{font-weight:700;}

  /* ---- title slide ---- */
  .title-slide{justify-content:center; gap:0;}
  .title-slide .eyebrow{margin-bottom:22px;}
  .title-slide h1{font-size:clamp(1.9rem,1.1rem + 3.4vw,3.6rem); font-weight:800; line-height:1.08; letter-spacing:-.015em; max-width:16ch;}
  .title-slide .subtitle{margin-top:18px; font-size:clamp(1rem,.9rem + .4vw,1.25rem); color:var(--ink-soft); max-width:48ch; line-height:1.5;}
  .kicker{
    margin-top:clamp(28px,5vw,46px); display:flex; gap:18px; align-items:flex-start;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:18px; padding:18px 20px; max-width:56ch;
  }
  .kicker svg{flex:none; width:52px; height:52px; color:var(--ink-soft);}
  .kicker p{margin:0; font-size:.92rem; line-height:1.55; color:var(--ink-soft);}
  .kicker code{background:var(--accent-soft); color:var(--accent); padding:.05em .35em; border-radius:5px; font-family:inherit; font-style:normal;}
  .hint{margin-top:26px; font-size:.78rem; color:var(--ink-soft); letter-spacing:.02em;}

  /* ---- divider slide ---- */
  .divider-slide{background:var(--accent); color:var(--accent-ink); justify-content:center; align-items:flex-start;}
  .divider-slide .num{font-family:'Unbounded',sans-serif; font-size:clamp(3rem,2rem + 5vw,7rem); font-weight:800; opacity:.35; line-height:1;}
  .divider-slide h2{color:var(--accent-ink); font-size:clamp(1.8rem,1rem + 3.4vw,3.2rem); margin-top:8px; max-width:14ch;}
  .divider-slide .sub{margin-top:14px; font-size:clamp(1rem,.9rem+.4vw,1.3rem); opacity:.85; max-width:34ch;}

  /* ---- cards ---- */
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:clamp(20px,3vw,34px); max-width:1000px;}
  @media (max-width:760px){.cards{grid-template-columns:1fr;}}
  .card{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:4px; padding:20px 20px 22px;}
  .card h3{font-family:'Golos Text',sans-serif; font-size:1.12rem; font-weight:700; margin-bottom:8px;}
  .card p{margin:0; font-size:.92rem; color:var(--ink-soft); line-height:1.5;}
  .card .tag{display:inline-block; margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:500; color:var(--ink-soft); border:1px solid var(--line); padding:3px 9px; border-radius:3px;}

  /* ---- checklist ---- */
  .checklist{list-style:none; margin:clamp(20px,3vw,34px) 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:14px 32px; max-width:900px;}
  @media (max-width:640px){.checklist{grid-template-columns:1fr;}}
  .checklist li{display:flex; gap:14px; align-items:baseline; font-size:1.02rem; line-height:1.4;}
  .checklist .n{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent); font-size:.82rem; flex:none;}

  /* ---- case / two box ---- */
  .case{margin-top:clamp(20px,3vw,30px); display:flex; flex-direction:column; gap:12px; max-width:680px;}
  .case .lead{font-size:1.02rem; color:var(--ink-soft); margin-bottom:4px; font-style:italic;}
  .box{border-radius:4px; padding:16px 18px; font-size:.98rem; line-height:1.5; border:1px solid var(--line); border-left:3px solid var(--line);}
  .box.q{border-left-color:var(--accent);}
  .box .tag{display:block; font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .result{border-radius:4px; padding:14px 18px; border:1px dashed var(--accent); color:var(--accent); font-weight:600; font-size:.98rem;}

  /* ---- bubbles ---- */
  .bubblewrap{margin-top:clamp(24px,4vw,40px); display:flex; flex-direction:column; gap:34px; max-width:700px;}
  .bubble-pair{display:flex; flex-direction:column; gap:14px;}
  .bubble-row{display:flex; flex-direction:column; gap:8px;}
  .bubble-label{font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;}
  .bubble-label.bad{color:var(--bad);}
  .bubble-label.good{color:var(--good);}
  .bubble{border-radius:4px; padding:14px 18px; font-size:.98rem; line-height:1.5; position:relative; border:1px solid var(--line);}
  .bubble.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent;}
  .bubble.good{background:var(--good-soft); color:var(--good); border-color:transparent;}
  .bubble-note{font-size:.85rem; color:var(--ink-soft); padding-left:4px;}
  .bubble-extra{display:flex; flex-direction:column; gap:16px; padding-top:6px; border-top:1px solid var(--line);}
  .bubble-extra p{margin:0; font-size:1rem; line-height:1.5; color:var(--ink);}
  .plain{font-size:1.02rem; line-height:1.55; color:var(--ink); max-width:64ch; margin-top:6px;}

  /* ---- quiz ---- */
  .quiz{margin-top:clamp(20px,3vw,30px); max-width:640px;}
  .quiz-q{border:1px solid var(--line); border-left:3px solid var(--ink-soft); border-radius:4px; padding:16px 18px; font-size:1.02rem; line-height:1.5;}
  .quiz .qtag{display:block; font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .quiz-a .qtag{color:var(--good);}
  .quiz-btn{margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:.76rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); background:none; border:1px solid var(--accent); border-radius:999px; padding:9px 20px; cursor:pointer;}
  .quiz-btn:hover{background:var(--accent-soft);}
  .quiz-a{margin-top:0; border:1px solid var(--good); border-left:3px solid var(--good); border-radius:4px; padding:0 18px; font-size:1.02rem; line-height:1.5; background:var(--good-soft); color:var(--good);
    max-height:0; opacity:0; overflow:hidden; margin-top:0;
    transition:max-height .4s ease, opacity .3s ease, margin-top .3s ease, padding .3s ease;}
  .quiz-a.show{max-height:320px; opacity:1; margin-top:14px; padding:16px 18px;}

  /* ---- quizshot ---- */
  .quizshot{margin-top:clamp(14px,2.2vw,22px); max-width:760px;}
  .quizshot .qs-img{width:100%; height:auto; border-radius:6px; border:1px solid var(--line); display:block; margin-bottom:4px;}
  .quizshot .quiz{max-width:100%;}

  /* ---- caseshots ---- */
  .caseshots{margin-top:clamp(16px,2.5vw,26px); max-width:1000px;}
  .shotrow{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:760px){.shotrow{grid-template-columns:1fr;}}
  .shot{display:flex; flex-direction:column; gap:8px;}
  .shot .tag{font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink);}
  .shot img{width:100%; height:auto; border-radius:6px; border:1px solid var(--line); display:block;}
  .caseshots .result{margin-top:18px; border:1px solid var(--line); color:var(--ink); font-weight:400;}

  /* ---- mistakes ---- */
  .mistakes{list-style:none; margin:clamp(20px,3vw,30px) 0 0; padding:0; display:flex; flex-direction:column; gap:24px; max-width:920px;}
  .mistakes li{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; padding-bottom:24px; border-bottom:1px solid var(--line);}
  .mistakes li:last-child{border-bottom:none; padding-bottom:0;}
  .mistakes .bad-q{flex:1 1 300px; border-left:3px solid var(--bad); padding-left:16px; font-size:1.02rem; line-height:1.5;}
  .mistakes .mistake-reveal{flex:1 1 280px;}
  .mistakes .mistake-reveal .qtag{display:block; font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px;}
  .mistakes .mistake-reveal .quiz-a .qtag{color:var(--good);}

  /* ---- dialogue ---- */
  .dialogue{margin-top:clamp(20px,3vw,30px); max-width:600px; display:flex; flex-direction:column; gap:10px; position:relative;}
  .line{border-radius:4px; padding:12px 16px; font-size:1rem; line-height:1.45; max-width:88%;}
  .line.r{background:var(--card); align-self:flex-start; border:1px solid var(--line);}
  .line.i{background:transparent; color:var(--accent); align-self:flex-end; font-weight:600; border:1px solid var(--accent);}
  .beat{align-self:center; font-size:.78rem; color:var(--ink-soft); margin:2px 0;}
  .scribble{
    position:relative; align-self:flex-end; margin-top:2px; margin-right:6px;
    font-family:'Unbounded',sans-serif; font-size:.8rem; color:var(--accent);
    transform:rotate(-4deg); border:2px dashed var(--accent); border-radius:60% 40% 55% 45%/50% 55% 45% 50%;
    padding:6px 14px;
  }
  .caption{margin-top:18px; font-size:.92rem; color:var(--ink-soft); max-width:56ch; line-height:1.5;}

  /* ---- columns ---- */
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:clamp(20px,3vw,30px); max-width:980px;}
  @media (max-width:700px){.cols{grid-template-columns:1fr;}}
  .col h3{font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;}
  .col ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .col li{font-size:.98rem; line-height:1.5; padding-left:18px; position:relative;}
  .col li::before{content:""; position:absolute; left:0; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--ink-soft);}

  /* ---- steps ---- */
  .steps{list-style:none; margin:clamp(20px,3vw,30px) 0 0; padding:0; display:flex; flex-direction:column; gap:16px; max-width:64ch; counter-reset:s;}
  .steps li{display:flex; gap:16px; align-items:flex-start;}
  .steps .sn{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.2rem; color:var(--accent); flex:none; width:2ch;}
  .steps .st{font-size:1.02rem; line-height:1.5; padding-top:.1em;}
  .guidelines-list{gap:20px;}
  .gl-example{margin-top:8px; padding:12px 16px; background:var(--bg-soft); border-left:3px solid var(--accent); border-radius:4px; font-size:.95rem; line-height:1.5; color:var(--ink);}
  .gl-note{margin-top:6px; font-size:.82rem; color:var(--ink-soft); font-style:italic;}

  /* ---- pipeline ---- */
  .pipeline{margin-top:clamp(16px,2.5vw,26px); max-width:1000px;}
  .pnode{display:inline-block; border:1.6px solid var(--ink); border-radius:4px; padding:10px 18px; font-weight:700; font-size:.98rem;}
  .parrow{font-family:'JetBrains Mono',monospace; color:var(--ink-soft); font-size:.85rem; line-height:1; margin:6px 0; padding-left:8px;}
  .pills{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0;}
  .pill{background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 13px; font-size:.82rem; color:var(--ink-soft);}
  .parms{display:grid; grid-template-columns:repeat(3,1fr); gap:28px; margin-top:10px;}
  @media (max-width:760px){.parms{grid-template-columns:1fr;}}
  .arm{display:flex; flex-direction:column;}
  .armhead{font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
  .pstep{background:var(--card); border:1px solid var(--line); border-radius:4px; padding:10px 13px; margin-bottom:8px;}
  .pstep .t{font-size:.92rem; font-weight:600; line-height:1.3;}
  .pstep .d{font-size:.78rem; color:var(--ink-soft); margin-top:2px; line-height:1.35;}
  .pconn{color:var(--ink-soft); text-align:center; font-size:.95rem; line-height:1; margin:2px 0;}

  /* ---- side media (image column) ---- */
  .has-media .slide-body{display:flex; gap:clamp(24px,4vw,56px); align-items:flex-start; width:100%;}
  .has-media .content-col{flex:1 1 auto; min-width:0;}
  .has-media .image-col{flex:0 0 clamp(200px,27vw,320px); max-width:320px; padding-top:4px;}
  .has-media .image-col.wide{flex:0 0 clamp(280px,40vw,460px); max-width:460px;}
  @media (max-width:820px){
    .has-media .slide-body{flex-direction:column;}
    .has-media .image-col{flex:none; max-width:220px; align-self:flex-start;}
    .has-media .image-col.wide{max-width:320px;}
  }
  .image-col img{width:100%; height:auto; border-radius:6px; border:1px solid var(--line); display:block;}
  .media-single{margin:0;}
  .media-single figcaption{margin-top:10px; font-size:.83rem; color:var(--ink-soft); line-height:1.5;}
  .media-pair{display:flex; flex-direction:column; align-items:center;}
  .media-pair .media-top{width:62%;}
  .media-pair .media-arrow{color:var(--accent); width:24px; height:24px; margin:2px 0;}
  .media-pair .media-bottom{width:100%; margin-top:2px;}
  .media-caption{margin-top:10px; font-size:.83rem; color:var(--ink-soft); line-height:1.5; align-self:stretch;}

  /* ---- diagram ---- */
  .diagram-wrap{margin-top:clamp(16px,2.5vw,26px); max-width:920px;}
  .diagram-wrap svg{width:100%; height:auto; color:var(--ink);}
  .diagram-wrap figcaption{margin-top:14px; font-size:.9rem; color:var(--ink-soft); max-width:60ch; line-height:1.5;}
  .diagram-wrap figure{margin:0;}
  .accentText{fill:var(--accent);}
  .softText{fill:var(--ink-soft);}
  .lineStroke{stroke:var(--line);}

  /* ---- closing ---- */
  .closing-slide{justify-content:center;}
  .closing-slide h2{font-size:clamp(1.8rem,1rem + 3vw,3rem);}
  .closing-slide .bullets{margin-top:28px;}
  .closing-slide .tagline{margin-top:clamp(24px,4vw,40px); font-family:'Unbounded',sans-serif; font-weight:700; font-size:clamp(1.3rem,1rem + 1.6vw,2rem); color:var(--accent);}
  .closing-foot{margin-top:clamp(30px,4vw,46px); font-size:.88rem; color:var(--ink-soft); max-width:52ch; line-height:1.5;}
  .closing-foot code{background:var(--accent-soft); color:var(--accent); padding:.05em .35em; border-radius:5px; font-style:normal;}

  /* ---- chrome (nav) ---- */
  #progress{position:fixed; top:0; left:0; height:3px; background:var(--accent); z-index:20; transition:width .4s ease;}
  #chrome{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: 14px clamp(16px,4vw,40px) calc(14px + env(safe-area-inset-bottom,0px));
    pointer-events:none;
  }
  #chrome > *{pointer-events:auto;}
  .navbtn{
    width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .navbtn:disabled{opacity:.3; cursor:default;}
  .navbtn svg{width:18px; height:18px;}
  .navgroup{display:flex; gap:10px; align-items:center;}
  #counter{font-size:.78rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; letter-spacing:.03em; min-width:52px;}
  #chrome.on-divider #counter{color:var(--accent-ink);}
  #chapters{display:flex; gap:7px;}
  .chapdot{width:8px; height:8px; border-radius:50%; background:var(--line); border:none; padding:0; cursor:pointer;}
  .chapdot[aria-current="true"]{background:var(--accent); width:20px; border-radius:5px;}
  #themebtn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #themebtn svg{width:16px;height:16px;}
  #fsbtn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #fsbtn svg{width:16px;height:16px;}
  #topright{position:fixed; top:16px; right:clamp(16px,4vw,40px); z-index:20; display:flex; gap:10px; align-items:center;}

  @media (prefers-reduced-motion: reduce){
    #track{transition:none;}
  }
</style>

<div id="progress" style="width:0%"></div>
<div id="deck">
  <div id="track"></div>
</div>

<div id="topright">
  <div id="chapters"></div>
  <button id="fsbtn" aria-label="Полноэкранный показ"></button>
  <button id="themebtn" aria-label="Переключить тему"></button>
</div>

<div id="chrome">
  <button class="navbtn" id="prevBtn" aria-label="Предыдущий слайд">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="navgroup"><span id="counter">01 / 24</span></div>
  <button class="navbtn" id="nextBtn" aria-label="Следующий слайд">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
(function(){
  "use strict";

  var CHAPTERS = [
    {key:"role", label:"Кто мы"},
    {key:"method", label:"Метод"},
    {key:"wording", label:"Вопросы"},
    {key:"reading", label:"Чтение данных"}
  ];

  function esc(s){ return s; }

  function bulletsHTML(items){

      '<text x="520" y="68" font-size="14" fill="currentColor">отвечает, почему</text>'+
      '<line x1="230" y1="84" x2="440" y2="150" stroke="currentColor" stroke-width="1.4" marker-end="url(#arw2)"/>'+
      '<line x1="690" y1="84" x2="480" y2="150" stroke="currentColor" stroke-width="1.4" marker-end="url(#arw2)"/>'+
      '<rect x="210" y="160" width="500" height="110" rx="12" fill="none" stroke="currentColor" stroke-width="1.6"/>'+
      '<text x="460" y="188" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">ПРОВЕРЯЕМ МЕТОДОЛОГИЮ</text>'+
      '<text x="460" y="214" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".8">та ли выборка, та ли формулировка</text>'+
      '<text x="460" y="234" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".8">не изменился ли контекст (акция, сезон, новость)</text>'+
      '<line x1="460" y1="270" x2="460" y2="298" stroke="currentColor" stroke-width="1.4" marker-end="url(#arw2)"/>'+
      '<rect x="160" y="300" width="600" height="130" rx="12" class="accentText" fill="currentColor" opacity=".1"/>'+
      '<text x="460" y="326" text-anchor="middle" font-size="13" font-weight="800" class="accentText">ЕСЛИ С МЕТОДОЛОГИЕЙ ВСЕ В ПОРЯДКЕ</text>'+
      '<text x="460" y="350" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".8">как правило, доверяем данным количественного исследования</text>'+
      '<text x="460" y="372" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".8">качественное и количественное напрямую не сравниваем</text>'+
      '<text x="460" y="394" text-anchor="middle" font-size="12.5" fill="currentColor" opacity=".8">на интервью не спрашиваем «нравится?», чтобы потом написать «нравится 9 из 10»</text>'+
      '</svg></figure>';
  }

  function pipelineHTML(s){
    var out = '<div class="pipeline">';
    out += '<div class="pnode">'+s.brief+'</div>';
    out += '<div class="parrow">↓ бриф определяет</div>';
    out += '<div class="pills">'+s.pills.map(function(p){return '<span class="pill">'+p+'</span>';}).join('')+'</div>';
    out += '<div class="parrow">↓</div>';
    out += '<div class="pnode">'+s.method+'</div>';
    out += '<div class="parms">';
    out += s.arms.map(function(a){
      var steps = a.steps.map(function(st,i){
        var conn = i>0 ? '<div class="pconn">↓</div>' : '';
        return conn+'<div class="pstep"><div class="t">'+st.t+'</div>'+(st.d?'<div class="d">'+st.d+'</div>':'')+'</div>';
      }).join('');
      return '<div class="arm"><div class="armhead">'+a.head+'</div>'+steps+'</div>';
    }).join('');
    out += '</div></div>';
    return out;
  }

  function dialogueHTML(){
    return '<div class="dialogue">'+
      '<div class="line r">«Баллы копятся медленно»</div>'+
      '<div class="beat">10 минут спустя</div>'+
      '<div class="line r">«Подписку отменять не буду»</div>'+
      '<div class="line i">«А почему не будете, если баллы копятся медленно?»<div class="scribble">вот тут поймали</div></div>'+
      '</div>';
  }

  var ARROW_DOWN_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v16M12 19l-6-6M12 19l6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function quizHTML(q){
    return '<div class="quiz">'+
      '<div class="quiz-q"><span class="qtag">Вопрос</span>'+q.question+'</div>'+
      '<button class="quiz-btn" type="button">Показать ответ</button>'+
      '<div class="quiz-a"><span class="qtag">Ответ</span>'+q.answer+'</div>'+
      '</div>';
  }

  function caseshotsHTML(s){
    return '<div class="caseshots">'+
      '<div class="shotrow">'+
        s.shots.map(function(sh){
          return '<div class="shot"><span class="tag">'+sh.tag+'</span><img src="'+sh.src+'" alt="'+sh.alt+'" loading="lazy"></div>';
        }).join('')+
      '</div>'+
      '</div>';
  }

  function mediaHTML(m){
    if(!m) return '';
    if(m.type==='pair'){
      return '<div class="media-pair">'+
        '<img class="media-top" src="'+m.top.src+'" alt="'+m.top.alt+'" loading="lazy">'+
        '<div class="media-arrow">'+ARROW_DOWN_SVG+'</div>'+
        '<img class="media-bottom" src="'+m.bottom.src+'" alt="'+m.bottom.alt+'" loading="lazy">'+
        (m.caption?'<div class="media-caption">'+m.caption+'</div>':'')+
        '</div>';
    }
    return '<figure class="media-single"><img src="'+m.src+'" alt="'+m.alt+'" loading="lazy">'+(m.caption?'<figcaption>'+m.caption+'</figcaption>':'')+'</figure>';
  }

  function renderSlide(s, i){
    var el = document.createElement('section');
    el.className = 'slide';
    var html = '';

    if(s.type==='title'){
      el.className+=' title-slide';
      html = '<div class="eyebrow">'+s.eyebrow+'</div>'+
        '<h1>'+s.h1+'</h1>'+
        '<p class="subtitle">'+s.subtitle+'</p>'+
        (s.hint?'<div class="hint">'+s.hint+'</div>':'');
    }
    else if(s.type==='divider'){
      el.className+=' divider-slide';
      html = '<div class="num">'+s.num+'</div><h2>'+s.title+'</h2>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');
    }
    else if(s.type==='bullets'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+bulletsHTML(s.items);
    }
    else if(s.type==='cards'){
      var intro = s.intro ? '<p class="plain" style="margin-top:14px;max-width:60ch;">'+s.intro+'</p>' : '';
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+intro+'<div class="cards">'+
        s.cards.map(function(c){
          return '<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p><span class="tag">'+c.tag+'</span></div>';
        }).join('')+'</div>';
    }
    else if(s.type==='checklist'){
      var lead = s.lead ? '<p class="plain" style="margin-top:14px;max-width:62ch;">'+s.lead+'</p>' : '';
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+lead+'<ul class="checklist">'+
        s.items.map(function(t,idx){ return '<li><span class="n">0'+(idx+1)+'</span><span>'+t+'</span></li>'; }).join('')+
        '</ul>';
    }
    else if(s.type==='pipeline'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+pipelineHTML(s);
    }
    else if(s.type==='flow'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="diagram-wrap">'+flowSVG()+'</div>';
    }
    else if(s.type==='lanes'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="diagram-wrap">'+lanesSVG()+'</div>';
    }
    else if(s.type==='case'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="case">'+
        '<div class="lead">'+s.lead+'</div>'+
        s.boxes.map(function(b){ return '<div class="box'+(b.accent?' q':'')+'"><span class="tag">'+b.tag+'</span>'+b.text+'</div>'; }).join('')+
        '<div class="result">'+s.result+'</div>'+
        '</div>';
    }
    else if(s.type==='caseshots'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><p class="plain">'+s.lead+'</p>'+caseshotsHTML(s);
    }
    else if(s.type==='quiz'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+
        (s.text?'<p class="plain">'+s.text+'</p>':'')+quizHTML(s);
    }
    else if(s.type==='quizshot'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+
        '<div class="quizshot"><img class="qs-img" src="'+s.before+'" data-after="'+s.after+'" alt="'+s.alt+'" loading="lazy">'+
        quizHTML(s)+'</div>';
    }
    else if(s.type==='guidelines'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><ol class="steps guidelines-list">'+
        s.items.map(function(it,idx){
          var extra = it.example ? '<div class="gl-example">'+it.example+'</div>' : '';
          var note = it.note ? '<div class="gl-note">'+it.note+'</div>' : '';
          return '<li><span class="sn">'+(idx+1)+'</span><span class="st">'+it.text+extra+note+'</span></li>';
        }).join('')+
        '</ol>';
    }
    else if(s.type==='mistakes'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><ul class="mistakes">'+
        s.items.map(function(m){
          var showLabel = m.btnLabel || 'Показать ответ';
          var hideLabel = m.btnLabelHide || 'Скрыть ответ';
          return '<li>'+
            '<div class="bad-q">'+m.bad+'</div>'+
            '<div class="mistake-reveal">'+
              '<button class="quiz-btn" type="button" data-show-label="'+showLabel+'" data-hide-label="'+hideLabel+'">'+showLabel+'</button>'+
              '<div class="quiz-a"><span class="qtag">'+m.label+'</span>'+m.good+'</div>'+
            '</div>'+
          '</li>';
        }).join('')+
        '</ul>';
    }
    else if(s.type==='dialogue'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2>'+dialogueHTML()+'<p class="caption">'+s.caption+'</p>'+
        (s.quiz?quizHTML(s.quiz):'');
    }
    else if(s.type==='cols'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><div class="cols">'+
        ['colA','colB'].map(function(k){
          var c=s[k];
          return '<div class="col"><h3>'+c.h+'</h3><ul>'+c.items.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>';
        }).join('')+'</div>';
    }
    else if(s.type==='steps'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><ol class="steps">'+
        s.items.map(function(t,idx){ return '<li><span class="sn">'+(idx+1)+'</span><span class="st">'+t+'</span></li>'; }).join('')+
        '</ol>';
    }
    else if(s.type==='plain'){
      html = '<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><p class="plain">'+s.text+'</p><div class="result" style="margin-top:16px;display:inline-block;">'+s.result+'</div>';
    }
    else if(s.type==='closing'){
      el.className+=' closing-slide';
      html = '<h2>'+s.title+'</h2><p class="plain" style="margin-top:18px;max-width:56ch;">'+s.text+'</p><div class="tagline">'+s.tagline+'</div>';
    }

    if(s.media){
      el.className+=' has-media';
      var wideCls = s.media.type==='pair' ? ' wide' : '';
      html = '<div class="slide-body"><div class="content-col">'+html+'</div><div class="image-col'+wideCls+'">'+mediaHTML(s.media)+'</div></div>';
    }

    el.innerHTML = html;
    return el;
  }

  var track = document.getElementById('track');
  SLIDES.forEach(function(s,i){ track.appendChild(renderSlide(s,i)); });

  var idx = 0;
  var total = SLIDES.length;

  var chapDotsEl = document.getElementById('chapters');
  CHAPTERS.forEach(function(c){
    var b = document.createElement('button');
    b.className='chapdot'; b.setAttribute('data-key', c.key); b.title = c.label;
    b.addEventListener('click', function(){
      var target = SLIDES.findIndex(function(s){ return s.chapter===c.key; });
      if(target>-1) goTo(target);
    });
    chapDotsEl.appendChild(b);
  });

  function currentChapter(){
    for(var j=idx;j>=0;j--){ if(SLIDES[j].chapter) return SLIDES[j].chapter; }
    return null;
  }

  function render(){
    track.style.transform = 'translateX(-'+ (idx*100) +'%)';
    document.getElementById('progress').style.width = (((idx+1)/total)*100)+'%';
    document.getElementById('counter').textContent = String(idx+1).padStart(2,'0')+' / '+total;
    document.getElementById('chrome').classList.toggle('on-divider', SLIDES[idx].type==='divider');
    document.getElementById('prevBtn').disabled = idx===0;
    document.getElementById('nextBtn').disabled = idx===total-1;
    var ch = currentChapter();
    Array.prototype.forEach.call(chapDotsEl.children, function(b){
      b.setAttribute('aria-current', b.getAttribute('data-key')===ch ? 'true':'false');
    });
  }

  function goTo(n){
    idx = Math.max(0, Math.min(total-1, n));
    render();
  }
  function next(){ goTo(idx+1); }
  function prev(){ goTo(idx-1); }

  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);

  track.addEventListener('click', function(e){
    var btn = e.target.closest('.quiz-btn');
    if(!btn) return;
    var ans = btn.parentElement.querySelector('.quiz-a');
    if(!ans) return;
    var showing = ans.classList.toggle('show');
    var showLabel = btn.dataset.showLabel || 'Показать ответ';
    var hideLabel = btn.dataset.hideLabel || 'Скрыть ответ';
    btn.textContent = showing ? hideLabel : showLabel;
    var shotWrap = btn.closest('.quizshot');
    if(shotWrap){
      var img = shotWrap.querySelector('.qs-img');
      if(img){
        if(showing && img.dataset.after){
          if(!img.dataset.before) img.dataset.before = img.getAttribute('src');
          img.src = img.dataset.after;
        } else if(!showing && img.dataset.before){
          img.src = img.dataset.before;
        }
      }
    }
  });

  window.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ next(); e.preventDefault(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ prev(); e.preventDefault(); }
    else if(e.key==='Home'){ goTo(0); }
    else if(e.key==='End'){ goTo(total-1); }
    else if(e.key==='f' || e.key==='F'){ toggleFullscreen(); }
  });

  var fsBtn = document.getElementById('fsbtn');
  var ENTER_FS_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var EXIT_FS_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 4v4a1 1 0 0 1-1 1H4M15 4v4a1 1 0 0 0 1 1h4M9 20v-4a1 1 0 0 0-1-1H4M15 20v-4a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function updateFsIcon(){
    fsBtn.innerHTML = document.fullscreenElement ? EXIT_FS_SVG : ENTER_FS_SVG;
  }
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      var el = document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    } else {
      if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFsIcon);
  updateFsIcon();

  var touchX=null;
  document.getElementById('deck').addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; }, {passive:true});
  document.getElementById('deck').addEventListener('touchend', function(e){
    if(touchX===null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx)>50){ dx<0 ? next() : prev(); }
    touchX=null;
  }, {passive:true});

  var themeBtn = document.getElementById('themebtn');
  var SUN = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  function applyTheme(t){
    if(t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    var isDark = t ? t==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    themeBtn.innerHTML = isDark ? SUN : MOON;
  }
  var savedTheme=null;
  try{ savedTheme = localStorage.getItem('deckTheme'); }catch(e){}
  applyTheme(savedTheme);
  themeBtn.addEventListener('click', function(){
    var isDark = document.documentElement.getAttribute('data-theme')==='dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('deckTheme', next); }catch(e){}
  });

  render();
})();
</script>
</body>
</html>
